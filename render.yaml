# Render Blueprint 配置文件
# 自动部署：推送 GitHub 后 Render 自动读取此文件

services:
  - type: web
    name: shenpi-server
    env: node
    # 构建命令：先构建前端，再安装后端依赖
    buildCommand: |
      cd client && npm install && npm run build && cd ../server && npm install
    # 启动命令：运行后端（托管 API + 前端静态文件）
    startCommand: cd server && node index.js
    # 环境变量（部署后在 Render 控制面板填写真实值）
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_URL
        sync: false        # 手动填写
      - key: TURSO_AUTH_TOKEN
        sync: false        # 手动填写
